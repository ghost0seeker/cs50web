{% extends 'auctions/layout.html' %}

{% block body %}
    <h2>Create Listing</h2>

    {% if message %}
        <div>{{ message }}</div>
    {% endif %}

    <form action="{% url 'create_listing' %}" method="post">
        {% csrf_token %}
        <div class="form-group">
            <input class="form-control" type="text" name="title" placeholder="Item Title">
        </div>
        <div class="form-group">
            <input class="form-control" type="text" name="description" placeholder="Item Description">
        </div>
        <div class="form-group">
            <input class="form-control" type="url" name="image" placeholder="Image URL">
        </div>
        <div class="form-group">
            <input class="form-control" type="text" name="initial_bid" placeholder="Initial Bid">
        </div>
        <div class="form-group">
            <select class="form-control" name="category">
                {% for category in categories %}
                    <option value="{{ category.id }}">{{ category.name }}</option>
                {% endfor %}
        </div>
        <input class="btn btn-primary" type="submit" value="Submit">
    </form>
    </form>
{% endblock %}
