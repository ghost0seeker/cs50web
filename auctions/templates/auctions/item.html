{% extends "auctions/layout.html" %}

{% block body %}
    <p class="h2">{{ item.title }}</p>
    <div class="item-card d-flex gap-3">
        <div class="card" style="width: 600px;" >
            <img src="{{ item.image }}" class="img-fluid" alt="{{ item.desc }}">
        </div>
        <div class="item_actions d-flex flex-column gap-2 flex-grow-1">
            <h4>Current Bid: $ {{ item.get_highest_bid }}</h4>
            <h5>Initial Bid: $ {{ item.initial_bid_price }}</h5>
            <form action="#" method="post" class="d-flex flex-column gap-2">
                {% csrf_token %}
                <div class="form-group" style="width: 250px;">
                    <input class="form-control" type="text" name="bid_amount" placeholder="Bid Amount">
                </div>
                <input class="btn btn-primary" type="submit" value="Submit" style="width: 250px;">
            </form>
            <hr class="flex-grow-1">
            
        </div>

    </div>
{% endblock %}
