<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="styles.css" rel="stylesheet">
    <title>Image Search</title>
</head>
<body>
    <nav class="nav">
        <div class="pill-shape-g">
            <a href="index.html">Google Search</a>
        </div>
        <div class="pill-shape-i">
            <a href="image.html">Image Search</a>
        </div>
    </nav>
    <form class="advanced-form" action="https://google.com/search">
        <div class="advanced-form-body">
            <div class="form-group">
                <label class="form-label">all these words: </label>
                <input class="form-input" name="as_q" type="text">            
            </div>
            <div class="form-group">
                <label class="form-label">this exact word or phrase:</label>
                <input class="form-input" name="as_epq" type="text">
            </div>
            <div class="form-group">
                <label class="form-label"> any of these words:</label>
                <input class="form-input" name="as_oq" type="text">
            </div>
            <div class="form-group">
                <label class="form-label">none of these words:</label>
                <input class="form-input" name="as_eq" type="text">
            </div>
        </div>
        <button id="advanced-search-button" type="submit">Advanced Search</button>
    </form>
</body>
</html>
