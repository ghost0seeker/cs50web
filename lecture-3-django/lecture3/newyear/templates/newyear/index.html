{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Is it new year?</title>
        <link href="{% static 'newyear/css/styles.css' %}" rel="stylesheet">
    </head>
    <body>
            {% if newyear %}
            <h1 class="yes">Yes</h1>
            {% else %}
            <h1 class="no">No</h1>
            {% endif %}
    </body>
</html>
